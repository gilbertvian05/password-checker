<!DOCTYPE html><html><head><title>Password Checker</title><style>body{background:#0f172a;color:white;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.box{background:#1e293b;padding:30px;border-radius:15px;width:400px;text-align:center}input{width:90%;padding:12px;border-radius:8px;border:none;margin:15px 0;font-size:16px}.bar{height:10px;background:#334155;border-radius:5px;overflow:hidden}.fill{height:100%;width:0%;transition:0.3s}.weak{background:#ef4444}.medium{background:#f59e0b}.strong{background:#22c55e}.god{background:#a855f7}</style></head><body><div class="box"><h1>🔒 Password Checker</h1><input type="text" id="pass" placeholder="Type password..." oninput="check()"><div class="bar"><div id="fill" class="fill"></div></div><p id="score">Score: 0</p><p id="strength">Start typing...</p><p id="time"></p><p id="feedback" style="color:#94a3b8"></p></div><script>function checkPassword(p){let s=0,f=[];if(p.length>=8)s+=20;if(p.length>=12)s+=20;if(p.length>=16)s+=10;if(p.length<8)f.push("Too short");if(/[A-Z]/.test(p))s+=15;else f.push("Need CAPITAL");if(/[a-z]/.test(p))s+=15;else f.push("Need small");if(/[0-9]/.test(p))s+=10;else f.push("Need number");if(/[!@#$%^&*]/.test(p))s+=10;else f.push("Need symbol");let st="",ct="";if(s<40){st="WEAK";ct="Hack: 2 sec"}else if(s<70){st="MEDIUM";ct="Hack: 2 weeks"}else if(s<90){st="STRONG!";ct="Hack: 5 years"}else{st="GOD MODE!";ct="Hack: 100+ years"}return{score:s,strength:st,crackTime:ct,feedback:f}}function check(){let p=document.getElementById("pass").value;let r=checkPassword(p);document.getElementById("score").innerText="Score: "+r.score+"/100";document.getElementById("strength").innerText=r.strength;document.getElementById("time").innerText=r.crackTime;document.getElementById("feedback").innerText=r.feedback.join(" | ");let f=document.getElementById("fill");f.style.width=r.score+"%";f.className="fill "+(r.score<40?"weak":r.score<70?"medium":r.score<90?"strong":"god")}</script></body></html>
